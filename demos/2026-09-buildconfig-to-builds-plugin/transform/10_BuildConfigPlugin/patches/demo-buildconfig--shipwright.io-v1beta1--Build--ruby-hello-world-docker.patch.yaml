- op: add
  path: /metadata/annotations
  value:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ConfigChange"}]'
    crane.konveyor.io/conversion-warnings: |-
      [demo-buildconfig/ruby-hello-world-docker] Output ImageStreamTag "ruby-hello-world:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/ruby-hello-world:latest
      [demo-buildconfig/ruby-hello-world-docker] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [demo-buildconfig/ruby-hello-world-docker] BuildConfig ruby-hello-world-docker uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [demo-buildconfig/ruby-hello-world-docker] BuildConfig ruby-hello-world-docker: ConfigChange trigger is dropped — the automatic first build will not happen; create a BuildRun manually once to start the first build.
      [demo-buildconfig/ruby-hello-world-docker] Found 1 trigger(s) (ConfigChange) on BuildConfig ruby-hello-world-docker — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/ruby-hello-world-docker
- op: add
  path: /metadata/labels
  value:
    app: ruby-hello-world
    build-type: docker
- op: add
  path: /spec
  value:
    output:
      image: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/ruby-hello-world:latest
    paramValues:
    - configMapValue: null
      name: dockerfile
      secretValue: null
      value: Dockerfile
    retention:
      failedLimit: 5
      succeededLimit: 5
    source:
      git:
        revision: master
        url: https://github.com/openshift/ruby-hello-world.git
      type: Git
    strategy:
      kind: ClusterBuildStrategy
      name: buildah
