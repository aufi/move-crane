apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ImageChange","imageChange":{"paused":true}}]'
    crane.konveyor.io/conversion-warnings: |-
      [demo-buildconfig/sample-nodejs] Output ImageStreamTag "sample-nodejs:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/sample-nodejs:latest
      [demo-buildconfig/sample-nodejs] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [demo-buildconfig/sample-nodejs] BuildConfig sample-nodejs uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [demo-buildconfig/sample-nodejs] BuildConfig sample-nodejs: ImageChange trigger is dropped — builds will no longer start when the strategy image nodejs:18-ubi8 changes. Shipwright has no equivalent of image change triggers today.
      [demo-buildconfig/sample-nodejs] Found 1 trigger(s) (ImageChange) on BuildConfig sample-nodejs — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/sample-nodejs
  labels:
    app: sample-nodejs
  name: sample-nodejs
  namespace: demo-buildconfig
spec:
  env:
  - name: NPM_MIRROR
    value: https://registry.npmjs.org
  output:
    image: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/sample-nodejs:latest
  paramValues:
  - configMapValue: null
    name: builder-image
    secretValue: null
    value: registry.access.redhat.com/ubi9/nodejs-18:latest
  retention:
    failedLimit: 3
    succeededLimit: 3
  source:
    contextDir: source-build
    git:
      revision: main
      url: https://github.com/shipwright-io/sample-nodejs
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
