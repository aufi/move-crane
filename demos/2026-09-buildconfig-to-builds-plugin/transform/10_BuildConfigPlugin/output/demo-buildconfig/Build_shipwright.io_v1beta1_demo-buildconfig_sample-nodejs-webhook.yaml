apiVersion: shipwright.io/v1beta1
kind: Build
metadata:
  annotations:
    buildconfig-to-shipwright/conversion-outcome: converted-with-warnings
    buildconfig-to-shipwright/original-triggers: '[{"type":"ImageChange","imageChange":{"paused":true}},{"type":"GitHub","secretReference":{"name":"github-webhook-secret"}}]'
    crane.konveyor.io/conversion-warnings: |-
      [demo-buildconfig/sample-nodejs-webhook] Output ImageStreamTag "sample-nodejs-webhook:latest" resolved to fallback URL: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/sample-nodejs-webhook:latest
      [demo-buildconfig/sample-nodejs-webhook] No explicit pushSecret found for ImageStreamTag output. Ensure the BuildRun uses a ServiceAccount with internal registry push access.
      [demo-buildconfig/sample-nodejs-webhook] BuildConfig sample-nodejs-webhook uses runPolicy "Serial", which is dropped: OpenShift queued its builds and ran them one at a time, but Shipwright BuildRuns run concurrently. Serialize the runs in your CI/CD pipeline if build ordering matters, for example when several BuildRuns push the same image tag
      [demo-buildconfig/sample-nodejs-webhook] BuildConfig sample-nodejs-webhook: ImageChange trigger is dropped — builds will no longer start when the strategy image nodejs:18-ubi8 changes. Shipwright has no equivalent of image change triggers today.
      [demo-buildconfig/sample-nodejs-webhook] BuildConfig sample-nodejs-webhook: GitHub webhook trigger is dropped — the old OpenShift webhook URL will stop working after migration, and Shipwright provides no replacement URL. Remove or repoint the webhook in your Git provider, then set up Pipelines-as-Code or Tekton Triggers to create BuildRuns on push events.
      [demo-buildconfig/sample-nodejs-webhook] Found 2 trigger(s) (GitHub, ImageChange) on BuildConfig sample-nodejs-webhook — none work in Shipwright today; builds must be started manually or by your own automation.
    crane.konveyor.io/converted-from: build.openshift.io/v1/BuildConfig/sample-nodejs-webhook
  labels:
    app: sample-nodejs-webhook
  name: sample-nodejs-webhook
  namespace: demo-buildconfig
spec:
  env:
  - name: NPM_MIRROR
    value: https://registry.npmjs.org
  output:
    image: image-registry.openshift-image-registry.svc:5000/demo-buildconfig/sample-nodejs-webhook:latest
  paramValues:
  - configMapValue: null
    name: builder-image
    secretValue: null
    value: registry.access.redhat.com/ubi9/nodejs-18:latest
  retention:
    failedLimit: 5
    succeededLimit: 5
  source:
    contextDir: source-build
    git:
      revision: main
      url: https://github.com/shipwright-io/sample-nodejs
    type: Git
  strategy:
    kind: ClusterBuildStrategy
    name: source-to-image
