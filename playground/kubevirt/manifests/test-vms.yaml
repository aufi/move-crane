apiVersion: v1
kind: Namespace
metadata:
  name: crane-kubevirt
  labels:
    crane.konveyor.io/test: kubevirt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: configured-data
  namespace: crane-kubevirt
  labels:
    app.kubernetes.io/name: configured-vm
    crane.konveyor.io/test: kubevirt
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web-vm
  namespace: crane-kubevirt
  labels:
    app.kubernetes.io/name: web-vm
    crane.konveyor.io/test: kubevirt
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-vm
    spec:
      domain:
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
        resources:
          requests:
            memory: 128Mi
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo:latest
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: configured-vm
  namespace: crane-kubevirt
  labels:
    app.kubernetes.io/name: configured-vm
    app.kubernetes.io/part-of: crane-kubevirt-test
    crane.konveyor.io/test: kubevirt
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configured-vm
        app.kubernetes.io/part-of: crane-kubevirt-test
    spec:
      domain:
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          - name: datadisk
            disk:
              bus: virtio
        resources:
          requests:
            memory: 128Mi
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo:latest
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: configured-vm
            write_files:
            - path: /tmp/crane-kubevirt-test
              content: migrated-by-crane
      - name: datadisk
        persistentVolumeClaim:
          claimName: configured-data
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: stopped-vm
  namespace: crane-kubevirt
  labels:
    app.kubernetes.io/name: stopped-vm
    crane.konveyor.io/test: kubevirt
spec:
  runStrategy: Halted
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stopped-vm
    spec:
      domain:
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
        resources:
          requests:
            memory: 128Mi
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo:latest
