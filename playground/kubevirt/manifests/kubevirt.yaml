apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      # Kubernetes v1.35 needs an explicit ImageVolume feature gate.
      # Use the compatible containerDisk implementation instead.
      disabledFeatureGates:
      - ImageVolume
      useEmulation: true
