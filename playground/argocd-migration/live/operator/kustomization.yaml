apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/argoproj-labs/argocd-operator/config/default?ref=v0.18.0
patches:
  - target:
      kind: Deployment
      name: argocd-operator-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
          value: crane-gitops-source,crane-gitops-target
