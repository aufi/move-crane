# Fleet and local-web already use the portable local API destination.
# Only explicit-web and its project permission retain a source API URL.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - AppProject_crane-sample.yaml
  - Application_local-web.yaml
  - Application_explicit-web.yaml
  - ApplicationSet_fleet.yaml
patches:
  - target:
      group: argoproj.io
      kind: Application
      name: explicit-web
    patch: |-
      - op: replace
        path: /spec/destination/server
        value: https://kubernetes.default.svc
  - target:
      group: argoproj.io
      kind: AppProject
      name: crane-sample
    patch: |-
      - op: replace
        path: /spec/destinations/1/server
        value: https://kubernetes.default.svc
