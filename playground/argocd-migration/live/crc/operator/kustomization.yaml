apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../operator
patches:
  - target:
      kind: Deployment
      name: argocd-operator-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: crane-gitops-crc
